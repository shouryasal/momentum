# config/earn.yaml — the single source of truth for Earn's limits, universe and schedules.
# TIER 2: human-only, edited through the console (or `python -m console.cli`), which writes
# the bless digest. Every risk default below is a spec-§9 value; tests assert them literally.
# Generated configs (freqtrade-*.json, riskgate.json, params-sleeve-*.json) are rendered
# from this file by `python -m ops.gen_freqtrade_config`; machine-local, mode-dependent
# output goes to var/runtime/ and is never committed.
#
# `phase:` is GONE. The live/test state per sleeve lives in the signed var/state/mode.json
# (ops/lib/mode_state.py) and EarnConfig.phase is computed from it. A legacy `phase:` key
# still loads, warns and is ignored.

meta:
  config_version: 2
  display_timezone: "Asia/Dubai"   # schedules below are Gulf time (UTC+4, no DST)

runtime:                           # host facts ops/setup.sh writes and preflight re-checks
  data_root: null                  # null = repo root; must be ext4 (9p/drvfs is refused)
  docker: { runtime: engine, compose_project: earn }
  require_host_awake_for_live: true
  require_keepalive_task_for_live: true

console:
  port: 8765                       # the bind address is the code constant 127.0.0.1
  session_hours: 168               # a week: sign in once, not once a day
  open_view: true                  # loopback GETs need no token (READ only; see ops/config.py)
  stepup_minutes: 10
  git_commit_on_save: true
  effects_default: apply_now
  poll_ms: { db: 2000, bots: 10000 }

git:
  live_branch: claude/code-building-plan-qxzqsg
  worktree_root: "../earn-worktrees"
  worktree_ttl_days: 14

security:
  agent_user: null                 # e.g. "earn-agent" once ops/setup_agent_user.sh has run
  agent_cli_wrapper: null          # "ops/agent_cli.sh" — required for LIVE_EXECUTE
  console_bind_note: "127.0.0.1 only (invariant)"

autonomy:
  # `run:` is the OPERATING axis — how much the scheduled loop does alone (off / watching /
  # proposing / trading). It is independent of mode, which is about whose money is at stake.
  # The live per-bot level is NOT here: a level is authority, so it lives HMAC-signed in
  # var/state/autonomy.json (ops.lib.autonomy_state) and only a human can raise it. What is
  # here is the ceiling that level is clamped to, and the spend caps the gate enforces.
  run:
    enabled: true                  # false pins every bot to `off`, whatever the state says
    max_level: proposing           # ceiling; raise to `trading` deliberately, never by drift
    late_grace_min: 15             # past a job's fire time before liveness says "late"
    stale_heartbeat_hours: 26      # no job at all in this window = "it has not run"
    spend:                         # model spend, per bot, enforced before a stage runs
      default: { daily_usd: 10.0, monthly_usd: 150.0 }
      overrides: {}                # e.g. b: { daily_usd: 4.0, monthly_usd: 60.0 }
      at_cap: degrade              # degrade = cheapest permitted tier; hold = stop deciding
      warn_at_pct: 80
  tier1_auto_merge: true           # master switch; false = every tier-1 change is HELD
  kinds:                           # kind -> {test|live: auto|approve|off}
    params:     { test: auto,    live: approve }
    prompt:     { test: auto,    live: approve }
    skill_edit: { test: auto,    live: approve }
    skill_new:  { test: approve, live: approve }   # with scripts/**: ALWAYS approve (code invariant)
    skill_bind: { test: approve, live: approve }
    model:      { test: approve, live: approve }
    revert:     { test: auto,    live: auto }      # restoring a previously approved state
  live_forces_human: true
  max_auto_merges_per_week: 5
  auto_revert: { enabled: true, window_days: 7, validity_drop_pct: 10, breach_increase: 1 }

# `universe.assets` and `universe.pairs` are GONE as stored keys. They are computed from the
# newest point-in-time snapshot under `refresh.snapshot_dir`, written by `ops.universe_refresh`
# and committed. That file is simultaneously the whitelist the bots run and the whitelist the
# backtests replay, which is the only way live and backtest can be the same system: verified
# against the installed freqtrade 2026.8, every dynamic pairlist we would want
# (VolumePairList, AgeFilter, SpreadFilter, VolatilityFilter, DelistFilter, ...) is
# SupportsBacktesting.NO, so freqtrade always runs StaticPairList over our snapshot.
# Every threshold below was measured on 2026-09-23 against the live Binance API and a
# survivorship-free panel of all 735 USDT spot pairs ever listed — docs/design/wide-universe.md.
universe:
  quote: USDT
  core: [BTC, ETH]                 # never rotated, never ranked; BTC's 200d MA gates the book
  data_only_symbols: ["BNB/USDT"]  # candles for fee conversion only; NEVER tradeable
  # Tokenized real-world assets that pass BOTH behavioural tests and are still not crypto.
  excluded_bases: [XAUT, PAXG]     # tokenized gold
  # Real crypto whose ticker matches the tokenized-equity name rule `^[A-Z]{2,6}B$`. Without
  # this the rule deletes six genuine coins along with AAPLB/TSLAB/MSTRB/QQQB/NFLXB.
  crypto_allowlist: [ARB, BNB, CKB, DGB, SHIB, TRB]
  rules:                           # the funnel, in order — §1.2. Today: 708 -> 107 watchlist
    min_ann_vol_120d: 0.20         # removes pegs; U (rank 23 by volume) sits at 0.4% ann vol
    vol_window_days: 120           # ... and a 30% floor would kill TRX at 0.21, a real coin
    min_weekend_volume_ratio: 0.35 # crypto trades Saturdays; tokenized equities do not
    weekend_window_days: 120       # median across all pairs is 0.86; 62 pairs fall below 0.35
    equity_token_pattern: "^[A-Z]{2,6}B$"
    require_ascii_base: true       # 牛来USDT is $32M ADV and nothing downstream is tested for it
    max_tick_bps: 50               # BTTC's tick is 270 bps: a 2.7% round trip before fees
    min_listing_age_days: 180      # data sufficiency (90d lookback + 60d vol + slack)
    volume_window_days: 90
    min_median_quote_volume_usdt: 1000000   # WATCHLIST floor — a name we will look at
    leveraged_suffixes: [UP, DOWN, BULL, BEAR]
  tiers:                           # membership only; the CAPS live in risk.max_weight/tier_caps
    major:     { min_median_quote_volume_usdt: 25000000, min_listing_age_days: 730 }
    satellite: { min_median_quote_volume_usdt: 5000000 }   # the MEMBERSHIP floor: 31 pairs today
  # ELIGIBILITY, stricter than membership: growth-audit.md §1.5's EXCLUSION FILTER with the
  # numbers the audit measured — vol60 <= 1.00 AND listing age >= 1095d AND median 90d
  # quote volume >= $10M. Passing names: median fwd 90d -7.17% vs -20.16%, P(90d dd < -40%)
  # 18.3% vs 41.2%, better in every regime on every leg, a plateau across an 80-cell grid
  # (100% of cells beat the baseline). Cost, stated: P(90d double) 5.41% -> 4.31%, and ZEC
  # (+845%, vol 1.32) would be excluded by it — it is a major, and the filter is a
  # satellite rule. Against the 2026-09-23 snapshot it removes 15 of the 23 satellites
  # (TAO, PUMP, ONDO, ENA, PENGU, TRUMP, XPL on age; HBAR, FIL, FET, DOT on volume; BCH,
  # INJ on volume and vol; UNI, PEPE on 60d vol) and keeps 8: LINK, AAVE, LTC, XLM, WLD,
  # ADA, SUI, AVAX. Membership above is what the weekly resolver writes into the snapshot
  # and is unchanged; eligibility is applied by ops.gen_freqtrade_config when the snapshot
  # is rendered into riskgate.json — a failing satellite is rendered exit_only, so it cannot
  # be entered and a held position is wound down through the normal path, not orphaned.
  satellite_eligibility: { max_ann_vol: 1.00, min_listing_age_days: 1095,
                           min_median_quote_volume_usdt: 10000000 }
  score:                           # §3.2 — deliberately NOT momentum (rank IC -0.067, t -7.4)
    liquidity_weight: 0.40         # the one cross-sectional sort that measured positive
    trend_quality_weight: 0.35
    long_trend_weight: 0.25        # 365d is the only positive-IC lookback (+0.023, t +2.26)
    long_trend_days: 365
    ma_days: 200
    vol_lookback_days: 60
    vol_band: [0.40, 1.50]
  refresh:
    cron: "0 18 * * 0"             # Sunday 18:00 Gulf, alongside backtest_data
    snapshot_dir: knowledge/universe
    max_tradeable_shrink: 0.50     # a Binance hiccup must not flatten the book
    history_days: 1000             # one /api/v3/klines page ~ 2.7 years of daily bars
    max_workers: 6
    exit_only_weeks: 4             # a name that leaves stays whitelisted, exit-only, this long
    deadline_s: 1800

exchange:
  name: binance                    # UAE entity, spot only
  fee_bps_assumed: 10              # base taker; BNB discount is measured by TCA, not assumed

sleeves:
  a: { label: rules,  strategy: SleeveA }   # seed: modes.test.seed_usdt / the live mode file
  b: { label: claude, strategy: SleeveB }
  benchmark: { label: hold_btc, pair: "BTC/USDT" }

modes:
  test:
    seed_usdt: { a: 10000, b: 10000 }       # seed for the NEXT test run (reset required)
    label: "baseline"
    simulate_approval: false                # rehearse propose-mode approvals in TEST
    benchmark_from_run_start: true
  live:
    max_seed_usdt: { a: 1000, b: 1000 }     # hard ceiling enforced by preflight
    min_test_days: 90                       # planning doc §10 (G3)
    min_propose_days: 30                    # before LIVE_EXECUTE (G6)
    require_zero_breach_days: 30
    submode_default: propose
    approval_ttl_hours: 6
    flatten_on_exit: true
    require_agent_user_for_execute: true
    require_stoploss_on_exchange: true
    one_live_sleeve_per_account: true
    confirm_phrase: "GO LIVE {sleeve} {seed} USDT"

risk:                              # the gate reads these (via riskgate.json); one test per control
  # Explicit per-asset caps, as a fraction of sleeve NAV, keyed by base asset. There is NO
  # `default` key any more and the gate does not invent one: an asset with neither an entry
  # here nor a tier in the universe snapshot has a cap of ZERO and the gate refuses it
  # (docs/design/wide-universe.md §2.2). A `default: 0.30` silently granted every newly
  # listed coin a 30% cap the moment it appeared in the universe — under a wide universe
  # that is three 30% alt positions nobody chose.
  max_weight: { BTC: 0.40, ETH: 0.30 }
  # The CEILING per universe tier. The snapshot may propose a lower cap for a name; it can
  # never propose a higher one — the gate takes min(snapshot cap, this ceiling). BTC and ETH
  # additionally carry their own entries in max_weight above, which bind first.
  tier_caps:                       # wide-universe.md §2.2
    core: 0.40                     # BTC/ETH; their max_weight entries are tighter still
    major: 0.15                    # tradeable, median 90d volume >= $25M, listed >= 2y
    satellite: 0.05                # tradeable, median 90d volume >= $5M
  max_gross_exposure: 0.80
  usdt_floor: 0.20
  daily_loss_stop: 0.03            # fires the daily stop (measured from the Gulf-DAY anchor)
  # HALVE, not flatten. docs/design/crisis-policy.md §0, 2019-01 -> 2026-09, costs on, the
  # same -3% trigger: flatten + 24h lock = -5.23% CAGR, 66.7 fires/yr, 10.66%/yr in fees and
  # a WORSE max drawdown than doing nothing; halve at the same trigger = +13.05% CAGR.
  # "The flatten is what does the damage, not the trigger." The trigger is kept as
  # measured; only the response moves. Entries stay locked for daily_stop_lock_hours.
  # hold, not halve (2026-09-29). crisis-policy.md §0, 2019-01 -> 2026-09, costs on, the same
  # -3% trigger: hold-and-stop-buying +30.53% CAGR, halve +13.05%, flatten -5.23%. Every
  # sale into the trigger measured as a loss of return, so the stop LOCKS ENTRIES for
  # daily_stop_lock_hours and sells nothing. The value says what the book actually does.
  daily_loss_response: hold
  daily_stop_lock_hours: 24        # the lock expires on a timestamp, never on a date
  # Measured from the Gulf-MONTH anchor, and it ends when that month does: the boundary
  # re-anchors NAV and releases the lock in the same tick. Per mode
  # (strategies/riskgate.py: GateConfig.monthly_lock_release):
  #   LIVE  -> human_or_month_end: the sleeve is PAUSED and a human may resume early via
  #            ops.lib.risk_resume; if nobody does, the Gulf month boundary ends it.
  #   TEST/backtest -> month_end: there is no human, so the boundary is the only release.
  # Never a lock that outlives the drawdown it measured — a -10% May must not block December.
  monthly_loss_stop: 0.10          # flatten + pause sleeve; early resume is human-only
  max_trades_per_day: 4            # per sleeve
  stoploss_guard: { count: 3, window_hours: 48, lock_hours: 24 }
  cooldown_candles: 2
  staleness_minutes: 30            # no candle or book snapshot in 30 min -> no entries + alert
  min_notional_usdt: 25
  stoploss_per_trade: 0.15         # per-trade safety net (freqtrade stoploss, market order)
  blackout: { macro_events: [US_CPI, FOMC], window_minutes: 60 }
  kill_file: ops/killdir/KILL
  max_entries_per_trade: 4         # initial + DCA + pyramid adds
  max_order_notional_pct: 0.20     # single order <= 20% of ledger NAV
  max_orders_per_day: 16           # discretionary orders per sleeve per Gulf day
  max_turnover_pct_per_day: 0.50   # traded notional / NAV per Gulf day
  # A reduction this large bypasses the churn/turnover/fee budgets whatever it is called.
  # "exit_signal" matched no risk-exit NAME, so SleeveA's only signal-driven sell -- the
  # 200-day MA flip, a 100% close -- was refusable by the monthly fee counter, and once
  # tripped it stayed refused on every candle until the month turned, leaving only the
  # per-position stop. Above the 0.05 rebalance band so ordinary trims stay budgeted.
  derisk_exempt_pct: 0.10          # de-risk >= 10% of NAV is never churn-blocked
  # --- wide-universe controls (docs/design/wide-universe.md §2.3-2.4) -------------------
  # A twenty-alt book is worth ~2 independent bets (measured avg pairwise corr 0.37-0.49,
  # N_eff saturating at 1.95 by N=20), and on the 20 worst BTC days since 2019 between
  # 86.7% and 100% of the top-30 alts fell with it. So width is capped, not celebrated.
  max_open_positions: 8            # per sleeve; 8 buys 1.82 of the 1.95 bets on offer
  # Satellites TO THE FLOOR (docs/design/dip-strategy.md §8.1 item 2, §9 item 2): the dip
  # study found 0 of 6,720 costed satellite configurations that beat holding BTC, the
  # reliable-set alt book measured -6.4% to -8.1% CAGR / -84.6% drawdown, and in
  # crisis-policy.md core recovered in 22 of 22 events while 65.1% of alts are still
  # underwater. Two positions and 5% of NAV keep the satellite machinery observable in
  # paper (one full-cap name, or two at the 2% min_position_pct_nav floor) without letting
  # it carry the book. Was 4 / 0.10.
  max_satellite_positions: 2
  max_satellite_gross: 0.05
  max_beta_to_btc: 1.30            # portfolio 60d realised beta; alts measure 1.03-1.48
  max_avg_pairwise_corr: 0.70      # 60d avg pairwise corr of the held book (calm p90 0.591)
  min_position_pct_nav: 0.02       # below this a position can only be opened and closed
  max_fee_pct_per_month: 0.01      # 1% NAV/month fee budget (matches G2/G3)
  market_entries_allowed: false    # market ENTRY orders need an explicit human opt-in
  protections: { max_drawdown: { lookback_candles: 6, trade_limit: 2 } }
  reconcile: { tolerance_pct: 0.005, dust_usdt: 10.0, block_on_mismatch: true }
  # --- the minimum-edge gate (docs/design/analogue-timing.md §4.4-4.5) -----------------
  # The round trip is 0.30% (15 bps/side: 10 fee + 5 slippage, config/backtest.yaml). A
  # plan whose SMALLEST booked target — lowest take-profit rung or lowest ROI level — does
  # not clear that by `multiple` is refused at every entry (gate check `min_edge`) and at
  # load time. k=3 is the dual form's first row: 0.90% gross needed. The shipped plan books
  # nothing (roi 10.0, no ladder) and passes; the fast-test rungs were moved from
  # 0.6%/1.2% (2x/4x) to 0.9%/1.5% (3x/5x) to clear it — see that profile's evidence.
  min_edge: { round_trip_cost_pct: 0.0030, multiple: 3.0 }
  # --- crisis-policy.md Tier 1: STOP BUYING, bounded ----------------------------------
  # The only crisis tier the evidence supports. A block_entries flag, scope ALL, written
  # through ops.lib.flags with expires_at = now + block_entries_hours. It touches no held
  # position, costs zero in fees, and is structurally unable to cause or block an exit.
  crisis: { block_entries_hours: 48 }

trading:                           # every value bounded by risk.*; all human-only
  timeframe: "4h"
  startup_candles: auto            # auto => (bounds['sleeve_a.trend.ma_days'].max + 20) days
  defaults:
    sizing_mode: target_weight
    order_types: { entry: limit, exit: limit }   # stoploss/emergency_exit/force_exit are market
    entry_price: { side: bid, offset_bps: 0 }
    exit_price:  { side: ask, offset_bps: 0 }
    reprice_on_timeout: false
    stoploss:
      fixed_pct: 0.10              # <= risk.stoploss_per_trade (cross-validated)
      on_exchange: auto            # auto => true in LIVE (required), false in TEST
      trailing: { enabled: false, activate_profit_pct: 0.04, distance_pct: 0.03,
                  only_offset_reached: true }
      atr: { enabled: false, period: 14, mult: 3.0, timeframe: "4h" }
      reentry_cooldown_hours: 24
    take_profit:
      roi_table: { "0": 10.0 }     # 10.0 = effectively off (today's behaviour)
      ladder: []                   # e.g. [{at_profit_pct: 0.10, sell_fraction: 0.25}]
    dca:      { enabled: false, max_adds: 2, step_pct: 0.05, size_multiplier: 1.0,
                cooldown_hours: 24, only_if_regime_up: true }
    pyramid:  { enabled: false, max_adds: 1, trigger_profit_pct: 0.05, size_multiplier: 0.5,
                cooldown_hours: 24 }
    scheduled_dca: { enabled: true, interval_days: 7, chunk_pct_nav: 0.05 }
    rebalance: { min_interval_hours: 4, band_source: execution }
    exchange_limits: { respect_min_stake: true, full_exit_below_min: true,
                       backoff_minutes: [15, 60, 240] }
  sleeves:
    a: { dca: { enabled: false } }  # deep-merged over defaults
    b: {}
  plan_bounds:                      # clamps for the optional proposal.plan block
    stop_pct: { min: 0.03, max: 0.15 }
    take_profit_pct: { min: 0.03, max: 0.50 }
    allowed_entry_styles: [passive, cross]
    allow_model_urgency: false

proposal:
  schema: schemas/proposal.json
  max_age_hours: 48                # then sleeve B drifts to sleeve A's rules targets
  sum_tolerance: 0.001             # the ONE epsilon for target-weight sums

execution:
  entry_unfilled_timeout_min: 20
  exit_unfilled_timeout_min: 20
  exit_timeout_count: 3            # after 3 timed-out exit replacements freqtrade uses emergency_exit (market)
  cross_ticks_buffer: 0.0005       # risk-stop exits: cross the spread by this fraction (marketable limit)
  rebalance_band: 0.05             # dead-band as fraction of NAV before SleeveB rebalances
  dust_weight: 0.01                # below this target weight, close the position

sleeve_a:                          # DEFAULTS; live values are config/params-sleeve-a.json (tier 1)
  trend: { ma_days: 200, hysteresis_pct: 0.02 }
  vol: { target_annual: 0.30, lookback_days: 20 }
  base_weights: { BTC: 0.40, ETH: 0.30 }
  dca: { interval_days: 7, chunk_pct_nav: 0.05 }

sleeve_b:
  drift_to_a_after_h: 48

paper:
  start_date: "2026-10-27"

bounds:                            # tier-2 bounds for tier-1 params; apply_changes enforces
  "sleeve_a.vol.target_annual": { min: 0.10, max: 0.50, max_step: 0.05 }
  "sleeve_a.trend.ma_days": { min: 100, max: 300, max_step: 25 }
  "sleeve_a.dca.chunk_pct_nav": { min: 0.01, max: 0.10, max_step: 0.02 }
  "execution.rebalance_band": { min: 0.02, max: 0.10, max_step: 0.02 }

escalation:
  stop_proximity_pct: 1.0          # drawdown within 1% of a stop -> hard-case flag

budgets:                           # TELEMETRY under the Claude Max subscription:
  mode: telemetry                  #   USD figures are estimates for reporting only;
  run_usd: { research: 4.00, review: 25.00 }   # per-run caps stay as runaway-loop safety
  monthly_usd: 150
  context_tokens: { research: 20000, review: 60000 }
  degrade_at_pct: 80               # legacy USD throttle input (telemetry)
  rate_limit:                      # the REAL degradation signal (RateLimitEvent frames)
    degrade_at_utilization: 0.80   # brief drops first; decision runs never throttle

tca:
  freeze_ratio: 1.5                # measured > 1.5x assumption ...
  freeze_days: 14                  # ... for 14 days -> tier1_freeze flag (human-cleared)
  calibration_min_fills: 20
  quote_fallback_max_s: 900
  alert_bps: 30                    # rolling 7d cost above this -> healthcheck alert + hard-case flag

research:
  slots: ["08:30", "16:00"]        # THE single source: cron lines, nearest_slot, healthcheck artifact
  deadline_s: 2400
  stage_deadlines_s: { flags: 240, brief: 360, decide: 900, shadow: 240 }
  postflight_margin_s: 120
  prompt_version: research.v4     # v4: dynamic universe, sparse targets, universe_snapshot
  stage_prompts:                   # code constants moved to files (tier 1, editable in the UI)
    flags: prompts/stages/flags.v1.md
    brief: prompts/stages/brief.v1.md
    brief_short: prompts/stages/brief_short.v1.md
    classify: prompts/stages/classify.v1.md
    scan: prompts/stages/scan.v2.md   # v2: two-tier features + the watchlist/tradeable split
    validate: prompts/stages/validate.v1.md

signals:
  enabled: true
  integration: pipeline            # legacy (today's TriggerEngine) | pipeline
  scanner:
    cron: "*/5 * * * *"
    run_after_ingest: true
    deadline_s: 240
    dedupe_minutes: 240
    max_candidates_per_cycle: 5
    detectors:
      news_event:    { enabled: true, events: [hack, depeg, delist, lawsuit, outage],
                       corroborated_only: true, fast_path_events: [hack, depeg, delist] }
      regime_flip:   { enabled: true }
      move:          { enabled: true, pct: { "1h": 2.5, "4h": 5.0, "24h": 8.0 } }
      near_stop:     { enabled: true, fast_path: true }
      funding:       { enabled: true, abs_8h: 0.0010 }
      breakout:      { enabled: true, tf: "1d", lookback: 20, confirm_close: true }
      rsi_extreme:   { enabled: true, tf: "4h", period: 14, low: 25, high: 75 }
      volume_spike:  { enabled: true, tf: "1h", zscore: 3.0, lookback: 72 }
      dip_from_high: { enabled: true, tf: "1d", pct: 12.0, lookback_days: 30 }
      ma_cross:      { enabled: false, tf: "1d", fast: 50, slow: 200 }
    screen: { enabled: true, task: scan, min_score: 0.60, gray_zone: [0.45, 0.65],
              allow_novel: true, news_since_min: 60 }
    scoring: { detector_weight: 0.6, screen_weight: 0.4 }
  validator:
    task: validate
    min_confidence: 0.65
    max_per_day: 6
    cooldown_min_per_asset: 120
    expire_after_min: 90
    deadline_s: 600
  planner:
    enabled: true                  # false = observe mode: validate but never fire research
    min_verdict: valid
    max_per_day: 3                 # replaces triggers.max_per_day (legacy key still accepted)
    cooldown_hours: 4
  outcomes: { resolve_after_hours: 24, measure_tf: "1h" }

watch:                             # the LOCAL holdings watcher — runs between decisions
  # Deterministic first: every number below is computed in Python before any model is
  # asked anything, and a numeric invalidation that has fired escalates with no model call
  # at all. The model is asked exactly one fuzzy question per holding, on a prompt sized
  # for a 6 GB GPU (~1.2k tokens against providers.ollama.options.num_ctx = 8192).
  # The watcher may ONLY write a watch_events row and request escalation: it can never
  # place, size or cancel an order, write a proposal or change config, and
  # runs/watch/guard.py enforces that rather than asking for it.
  enabled: true
  cron: "*/7 * * * *"
  deadline_s: 120
  # holdings_watch, not classify (2026-09-29): the watcher was routing its one fuzzy question
  # per holding through the news classifier's row, so tasks.holdings_watch in models.yaml —
  # the row the owner's design names, local model at the head, haiku escalation — had never
  # run once (docs/design/local-model-choice.md; paper-trading-review-2026-09-29.md §6 #12).
  task: holdings_watch             # a declared cheap, tools-free task (models.yaml)
  local_only: true                 # the router is handed the local provider and nothing else
  max_holdings_per_cycle: 8
  max_mark_age_min: 30.0
  news: { window_min: 180, max_headlines: 5, include_market_wide: true,
          embed_model: nomic-embed-text, cluster_threshold: 0.86, token_threshold: 0.55 }
  escalate:
    on_invalidation_fired: true    # a fact: bypasses the cooldown
    on_risk_threshold: true        # also a fact: bypasses the cooldown
    stop_proximity_pct: 1.0
    drawdown_pct: 12.0
    broken_min_confidence: 0.70    # "broken" and "weakened" are different claims and
    weakened_min_confidence: 0.85  # do not share a bar
    hand_raises_to_escalate: 4     # persistence: 4 mutters in the window is a pattern
    window_min: 60
    cooldown_min: 90               # one republished story cannot wake Claude twice

discovery:                         # THE SELF-RESEARCH LOOP (runs/discovery.py)
  # Until now every strategy finding this system holds was produced by a BUILD-TIME agent
  # and handed over as finished config. That tests the builders, not the product. This
  # section is the product forming its own hypotheses, measuring them against history,
  # validating them by the edge-audit rules and proposing survivors through the SAME change
  # gate a human-authored change goes through — where every number it claims is recomputed
  # by evals/verify_change.py before anything merges.
  #
  # What it can never do, by construction and not by promise: touch a risk limit, the
  # universe, capital, mode, credentials, execution code or the gate. Its patches live in
  # the three namespaces evals/backtest_api.py allows (params.*, trading.*, execution.*)
  # and only `params.*` within `bounds:` can become a proposal at all — the rest is
  # reported as a finding for a human. A local model may never select or author here
  # (select_task must declare min_tier >= 3 and allow_local false; the code re-checks it).
  enabled: true
  generate_task: brief             # the cheap tier drafts candidates
  select_task: discover            # the stronger tier picks which enter the queue
  prompt: prompts/stages/discover.v1.md
  max_open_hypotheses: 12          # ungraded hypotheses before generation stops
  seed_dir: knowledge/hypotheses   # the starting queue (seeded from measured findings)
  report_dir: reports/discovery
  postflight_margin_s: 300
  pairs: []                        # empty = the configured whitelist; never widens it
  passes:
    # Nightly: drain the queue, no proposal. Cheap enough to run every day.
    light: { hypotheses: 1, folds: 2, timerange: "20230101-", deadline_s: 3000,
             generate: false, propose: false }
    # Weekly: generate new candidates, full window, four folds, may package ONE survivor.
    deep:  { hypotheses: 2, folds: 4, timerange: "20210101-", deadline_s: 10200,
             generate: true,  propose: true }
  gates:                           # the loop's own bar; the change gate still binds on top
    min_oos_win_rate: 0.5
    min_folds: 2
    min_trades: 20
    require_hurdle: true           # the DEFLATED hurdle, never the baseline
    require_beat_benchmark_direction: true   # both baselines, or it is not a result
    max_proposals_per_run: 1

triggers:                          # kept for back-compat; unset keys derive from signals.*
  enabled: true

ingest:
  timeframes: ["1h", "4h", "1d"]
  cold_start_days: 7

news:
  window_hours: 12
  min_sources: 2                   # two-source corroboration rule
  classify: { enabled: true, model: claude-haiku-4-5-20251001, monthly_budget_usd: 5 }
  whitelist:
    - { name: CoinDesk, url: "https://www.coindesk.com/arc/outboundfeeds/rss/", class: secondary }
    - { name: Cointelegraph, url: "https://cointelegraph.com/rss", class: secondary }
    - { name: TheBlock, url: "https://www.theblock.co/rss.xml", class: secondary }
    - { name: Blockworks, url: "https://blockworks.co/feed", class: secondary }
    - { name: Decrypt, url: "https://decrypt.co/feed", class: secondary }
    - { name: BitcoinMagazine, url: "https://bitcoinmagazine.com/feed", class: secondary }
    - { name: EthereumFoundation, url: "https://blog.ethereum.org/en/feed.xml", class: primary }
    - { name: BitcoinCore, url: "https://bitcoincore.org/en/rss.xml", class: primary }
    - { name: FederalReserve, url: "https://www.federalreserve.gov/feeds/press_all.xml", class: primary }
  event_keywords:                  # moved out of runs/ingest.py
    etf:     [etf]
    hack:    [hack, exploit, stolen, breach]
    delist:  [delist]
    # `settlement`: the 09-25 word-boundary fix stopped `settle` matching it ("ment" is
    # not an inflection). A lawsuit settlement is a real signal; "instant settlement
    # rails" comes back with it and is the accepted cost.
    lawsuit: [sec, lawsuit, charges, settle, settlement]
    upgrade: [upgrade, fork, "hard fork"]
    outage:  [outage, halt, paused]
    depeg:   [depeg, de-peg]
    macro:   [fomc, cpi, "rate cut", "rate hike", fed]
  asset_keywords:                  # must cover universe.assets
    BTC: [bitcoin, btc]
    ETH: [ethereum, "eth ", "ether "]

skills:
  bindings:                        # human base (tier 2); tier-1 overlay: config/skills-registry.auto.yaml
    research.flags: [reg-watch]
    research.brief: [crypto-brief]
    validate: [market-state, asset-dossier]
    review: [post-mortem, strategy-lab, tca, risk-gate, skill-smith]
    daily_review: [post-mortem, strategy-lab, asset-dossier]
  policy:                          # who may edit what: human | gated
    default: { body: gated, scripts: human, tests: gated }
    ops-runbook: { body: human, scripts: human, tests: human }
    tca: { body: gated, scripts: human, tests: human }
    risk-gate: { body: gated, scripts: human, tests: human }
  eval: { min_pass_rate: 0.8, timeout_s: 300 }

telegram:
  chat_id: 0                       # the ONE chat the bot accepts; 0 until configured
  user_id: 0
  dedupe_ttl_min: 60

ops:
  staleness_min: 30
  missed_run_grace_min: 30
  container_heartbeat_min: 10
  max_restarts_per_hour: 3
  summary_time_local: "21:00"      # daily digest; silence is itself an alert
  cron_mailto: ""                  # "" keeps today's behaviour; the setup wizard suggests the local user
  bots:
    a: { service: freqtrade-a, api: "http://127.0.0.1:8080", password_env: FT_API_PASSWORD_A }
    b: { service: freqtrade-b, api: "http://127.0.0.1:8081", password_env: FT_API_PASSWORD_B }
  schedules:                       # Gulf time; the crontab must match (asserted by test)
    ingest:        { cron: "*/15 * * * *",  deadline_s: 600,  artifact: ingest_runs }
    scanner:       { cron: "*/5 * * * *",   deadline_s: 240,  artifact: none }
    nav_tick:      { cron: "*/15 * * * *",  deadline_s: 120,  artifact: none }
    reconcile:     { cron: "*/15 * * * *",  deadline_s: 120,  artifact: none }
    tca_job:       { cron: "5 * * * *",     deadline_s: 1500, artifact: tca_rows }
    # The snapshot every study reads instead of the live databases. :37 is clear of the
    # */5, */15 and :05 jobs on purpose. It takes the ops lock and SKIPS if anything else
    # holds it or a source is busy — a reader that waited is what blocked entries for
    # 6h42m on 2026-09-30. See ops/lib/snapshot.py.
    snapshot:      { cron: "37 * * * *",    deadline_s: 300,  artifact: none }
    nav_job:       { cron: "10 0 * * *",    deadline_s: 300,  artifact: nav_rows }
    healthcheck:   { cron: "*/5 * * * *",   deadline_s: 240,  artifact: none }
    research_run:  { cron: derived,         deadline_s: 2700, artifact: proposals_file }
    review_run:    { cron: "0 20 * * 0",    deadline_s: 6600, artifact: report_file }
    backtest_data: { cron: "0 18 * * 0",    deadline_s: 1800, artifact: none }
    backup:        { cron: "0 3 * * *",     deadline_s: 2700, artifact: backup_file }
    maintenance:   { cron: "0 2 * * 1",     deadline_s: 3600, artifact: maintenance_row }
    daily_review:  { cron: "30 21 * * *",   deadline_s: 3300, artifact: daily_report }
    # One line per discovery.passes entry. Nightly 02:20 Gulf (clear of maintenance at
    # 02:00 Monday) and Saturday 04:00 (clear of backtest_data and review on Sunday). Both
    # take the SAME flock, so a long deep pass can never overlap the next light one.
    # artifact: none — a pass that finds nothing writes nothing, and that is a correct
    # outcome, not a missed run. Liveness is the `runs` row it always journals.
    discovery_light: { cron: "20 2 * * *",   deadline_s: 3600,  artifact: none }
    discovery_deep:  { cron: "0 4 * * 6",    deadline_s: 11400, artifact: none }
    # research_run.cron is `derived`: ops/gen_ops_files.py renders one line per
    # research.slots entry, which is also what nearest_slot and the healthcheck read.

backup:
  dest: "~/earn-backups"           # ~ and $VARS are expanded
  mirror_dest: null                # e.g. /mnt/c/Users/<you>/OneDrive/earn-backups (warn only)
  keep_daily: 14
  keep_weekly: 8

maintenance:                       # Monday 02:00 Gulf self-maintenance (runs/maintenance.py)
  sdk_floor: "0.2.157"             # claude-agent-sdk auto-upgrade window: pip resolves
  sdk_ceiling: "0.5"               # within [floor, ceiling); red tests -> exact rollback
  shadow_days: 30                  # auto-shadow window for a newly detected model

daily_review:                      # nightly learning loop (runs/daily_review.py, 21:30 Gulf)
  model: claude-fable-5-1          # grades the PREVIOUS Gulf day at max effort
  fallback_model: claude-opus-5    # explicit rerun; fallback-authored changes are HELD
  max_turns: 40
  max_budget_usd: 8.0              # runaway-loop safety (telemetry mode)
  wrong_process_below: 70          # process grade below this = wrong decision -> trace report

review:
  model: claude-fable-5-1
  fallback_model: claude-opus-5    # explicit rerun on failure; fallback-authored changes are HELD
  max_turns: 150
  max_budget_usd: 15.0
  replay:
    days: 30
    min_snapshots: 20
    runs_per_snapshot: 2
    budget_usd: 8.0
    target_tolerance: 0.02
    determinism_min_identical: 1.0
    turnover_max_ratio: 1.25
  change_gates:
    backtest_min_years: 2
    walk_forward_min_out_sample_delta: 0.0
    max_param_changes_per_month: 2
  outcome_stats_min_decisions: 30
  lessons_reconfirm_days: 180
  recurring_cause_weeks: 3
  fewshot: { best: 2, worst: 2, refresh: monthly }

models_config: config/models.yaml

# A PROFILE is a named overlay over this file, applied at load time and then re-validated
# by the whole schema and every cross-check — so a profile can never say something this
# file could not. `active: null` is the shipped system and is what every test asserts.
# Selecting one is this key and nothing else; switching back is this key and nothing else.
# A profile may only set trading.*, execution.*, sleeve_a.*, sleeve_b.* and
# sleeves.<s>.strategy (ops.config.PROFILE_ALLOWED_PREFIXES, deny by default). It can
# NEVER touch risk, bounds, universe, modes, autonomy or exchange — and
# ops.config.assert_profile_preserves_protection re-derives both configs and refuses the
# profile unless those four sections are identical and no per-trade stop got looser.
# Shipped overlays: config/profiles/fast-test.yaml — the 10-hour plumbing test.
profiles:
  # Selecting a profile HERE breaks ~108 tests, because much of the suite reads
  # `load_config()` where it means "the shipped configuration" and then asserts shipped
  # numbers (SleeveA/SleeveB, 4h, stoploss 0.10, roi_table {"0": 10.0}, startup candles
  # from the 4h bound), and five console fixtures build a temp repo from a hardcoded
  # CONFIG_FILES list that does not include config/profiles/ — so load_config(root=tmp)
  # raises FileNotFoundError on the overlay. Two more (tests/test_modes/test_modes.py
  # TestHappyPath) fail CORRECTLY, because assert_profile_not_live refuses to render a
  # live runtime while any profile is active. Until those are made profile-aware, the
  # 10-hour plumbing run selects fast-test in the RUNTIME deployment (~/earn-run) only,
  # where it is blessed and where the bots read it. Flipping it back there is this same
  # key plus `python -m ops.gen_freqtrade_config` and a re-bless.
  active: null
  dir: config/profiles

paths:
  knowledge_db: knowledge/earn.db
  journal_db: journal/journal.db
  flags_file: knowledge/flags.json
  state_latest: knowledge/state/latest.json
  proposals_dir: proposals
  data_dir: data
  fewshot: prompts/examples/fewshot.json
  params_a: config/params-sleeve-a.json
  params_b: config/params-sleeve-b.json
