# Model routing (spec section 3a). The ONLY place model ID strings appear.
# Tier 2 (human-only). runs/router.py resolves per task; escalation is explicit and
# journaled — never a silent downgrade or upgrade.
models:
  fable: claude-fable-5-1
  opus: claude-opus-5
  sonnet: claude-sonnet-5
  haiku: claude-haiku-4-5-20251001

tasks:
  decide:  { model: opus,   escalation: fable,       fallback: null,      retry: 1,
             max_usd_per_run: 2.00, max_turns: 12, monthly_budget_usd: 60 }
  brief:   { model: sonnet, escalation: null,        fallback: haiku_short, retry: 1,
             max_usd_per_run: 0.50, max_turns: 10, monthly_budget_usd: 12 }
  flags:   { model: haiku,  escalation: null,        fallback: keep_last, retry: 1,
             max_usd_per_run: 0.20, max_turns: 6,  monthly_budget_usd: 4 }
  review:  { model: fable,  escalation: null,        fallback: opus,      retry: 0,
             max_usd_per_run: 15.00, max_turns: 150, monthly_budget_usd: 70 }
  classify: { model: haiku,  escalation: null,       fallback: rule,      retry: 0,
              max_usd_per_run: 0.05, max_turns: 1,  monthly_budget_usd: 5 }

budget:
  monthly_total_usd: 150
  throttle_at_pct: 80        # 16:00 brief drops first; decide runs are NEVER skipped

shadow:                       # 30-day shadow mode for promoting a new decision model
  enabled: false
  model: null                 # key into models:
  started: null               # YYYY-MM-DD
  days: 30
  monthly_budget_usd: 20
