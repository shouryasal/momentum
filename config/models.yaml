# Model routing (spec section 3a) — the human-pinned BASE. Tier 2 (human-only).
# The tier-1 overlay config/models-auto.yaml (written by auto-shadow/auto-promotion)
# deep-merges on top; runs/router.py resolves per task; escalation is explicit and
# journaled — never a silent downgrade or upgrade. Reasoning effort floor is "high"
# (clamped in code); decide/review run at "max".
models:
  fable: claude-fable-5-1
  opus: claude-opus-5
  sonnet: claude-sonnet-5
  haiku: claude-haiku-4-5-20251001

tasks:
  decide:  { model: opus,   escalation: fable,       fallback: null,      retry: 1,
             effort: max,  max_usd_per_run: 4.00, max_turns: 12, monthly_budget_usd: 60 }
  brief:   { model: sonnet, escalation: null,        fallback: haiku_short, retry: 1,
             effort: high, max_usd_per_run: 1.00, max_turns: 10, monthly_budget_usd: 12 }
  flags:   { model: haiku,  escalation: null,        fallback: keep_last, retry: 1,
             effort: high, max_usd_per_run: 0.40, max_turns: 6,  monthly_budget_usd: 4 }
  review:  { model: fable,  escalation: null,        fallback: opus,      retry: 0,
             effort: max,  max_usd_per_run: 25.00, max_turns: 150, monthly_budget_usd: 70 }
  classify: { model: haiku,  escalation: null,       fallback: rule,      retry: 0,
              effort: high, max_usd_per_run: 0.20, max_turns: 1,  monthly_budget_usd: 5 }

budget:                       # TELEMETRY under the Claude Max subscription —
  monthly_total_usd: 150      # degradation keys on rate-limit signals, not USD;
  throttle_at_pct: 80         # per-run max_usd stays as runaway-loop safety only.
                              # 16:00 brief drops first; decide runs are NEVER skipped

shadow:                       # 30-day shadow mode for promoting a new decision model
  enabled: false
  model: null                 # key into models:
  started: null               # YYYY-MM-DD
  days: 30
  monthly_budget_usd: 20
