# Week-3 G1 rehearsal override: real testnet round trips for sleeve A.
#   docker compose -f docker-compose.yml -f docker-compose.testnet.yml up -d freqtrade-a
# Requires TESTNET keys in .env (BINANCE_KEY_A/BINANCE_SECRET_A pointing at
# testnet.binance.vision credentials). dry_run stays OFF only here, against testnet.
services:
  freqtrade-a:
    environment:
      FREQTRADE__DRY_RUN: "false"
      FREQTRADE__EXCHANGE__KEY: "${BINANCE_KEY_A}"
      FREQTRADE__EXCHANGE__SECRET: "${BINANCE_SECRET_A}"
      FREQTRADE__EXCHANGE__URLS__API: "https://testnet.binance.vision/api"
