[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earn"
version = "0.1.0"
description = "Earn — spot-only autonomous crypto trading system (Freqtrade executor, Claude analyst, deterministic risk gate)"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk==0.2.157",
    "pydantic>=2.9,<3",
    "PyYAML>=6.0",
    "ruamel.yaml>=0.18",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "jsonschema>=4.23",
    "feedparser>=6.0",
    "python-telegram-bot>=22,<23",
    "anthropic>=1.7",
    "freqtrade-client==2026.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "pre-commit",
    "freezegun",
    "types-PyYAML",
    "freqtrade==2026.8",   # ONLY for adapter tests importing IStrategy; bots run in Docker
]

[tool.setuptools]
packages = ["ops", "ops.lib", "runs", "strategies", "evals", "schemas"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
packages = ["ops"]
strict = true
